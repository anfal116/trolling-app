<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a4f7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="عمق التروللينق">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>حاسبة عمق التروللينق</title>
<style>
:root{--bg:#f2f4f7;--card:#ffffff;--card2:#f0f3f7;--ink:#0b1f2e;--mut:#6b7a88;--line:#e3e8ee;--acc:#ff7a1a;--accs:#fff1e6;--acc2:#0a4f7a;--top1:#0a4f7a;--top2:#06324f;--warn:#d64545}
html.night{--bg:#07141d;--card:#0f2230;--card2:#14293a;--ink:#e8f0f5;--mut:#8aa0b0;--line:#1f3a4d;--acc:#ffa24a;--accs:#2a2015;--acc2:#3fb5e0;--top1:#0f2a3d;--top2:#07141d;--warn:#ff8a7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:0 0 40px}
/* header */
.top{position:sticky;top:0;z-index:10;background:linear-gradient(160deg,var(--top1),var(--top2));color:#fff;border-radius:0 0 26px 26px;padding:14px 18px 16px;box-shadow:0 10px 30px #06324f40}
.bar{display:flex;justify-content:space-between;align-items:center}
h1{font-size:17px;font-weight:700;margin:0;opacity:.95}
h1 b{color:var(--acc);font-weight:800}
.nb{width:38px;height:38px;border-radius:12px;border:none;background:#ffffff1f;color:#fff;font-size:18px;cursor:pointer}
#out{margin-top:10px;min-height:120px}
.hero{text-align:center}
.hero .k{font-size:12.5px;color:#cfe0ec;margin:0}
.hero .k:nth-child(2){font-size:13px;color:#9fc2d8;margin-top:6px}
.hero .v{font-size:56px;font-weight:800;color:#fff;line-height:1.05;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.hero .v2{font-size:16px;color:var(--acc);font-weight:700}
.hero .warn{font-size:12.5px;color:#ffd2c4;margin-top:4px}
.hero .dm{display:block;font-size:.5em;color:#cfe0ec;font-weight:500}
.spd{display:inline-block;margin-top:8px;background:#ffffff1a;border-radius:999px;padding:2px 12px;font-size:12px;color:#d7e6f0}
.empty{text-align:center;color:#cfe0ec;font-size:14px;padding-top:6px}
.empty div{font-size:56px!important;font-weight:800;color:#ffffff55!important;line-height:1.1}
#out .note,#out table{display:none}
/* sections */
.sec{background:var(--card);margin:14px 14px 0;border-radius:22px;padding:16px;box-shadow:0 1px 2px #0b1f2e0a,0 4px 16px #0b1f2e0a}
.lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;font-weight:700;color:var(--ink);margin:0 0 12px}
.num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--acc2);color:#fff;font-size:12px;font-weight:800;margin-inline-end:8px}
/* chart picker */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs button{position:relative;font-family:inherit;color:var(--ink);background:var(--card2);border:2px solid transparent;border-radius:16px;padding:12px 8px;cursor:pointer;text-align:center;transition:.15s}
.tabs .ic{display:block;font-size:26px;line-height:1.2}
.tabs button b{display:block;font-size:13.5px;font-weight:700}
.tabs button small{display:block;color:var(--mut);font-size:11px}
.tabs button.on{border-color:var(--acc);background:var(--accs)}
.tabs button.on::after{content:"✓";position:absolute;top:6px;left:8px;width:18px;height:18px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;line-height:18px}
/* board strip */
#boards{display:flex;gap:8px;flex-wrap:wrap;padding:2px}
#boards::-webkit-scrollbar{display:none}
#boards button{flex:none;min-width:54px;height:54px;padding:0 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:18px;font-weight:700;cursor:pointer;white-space:nowrap}
#boards button.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 4px 12px #ff7a1a55}
#chNote{font-size:12px;color:var(--mut);margin-top:6px}
/* unit segmented */
#du{display:inline-flex;background:var(--card2);border-radius:12px;padding:3px;gap:2px}
#du button{border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--mut);padding:6px 12px;border-radius:9px;cursor:pointer}
#du button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px #0b1f2e22}
/* stepper */
.big{direction:ltr;display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:20px;padding:8px}
.st{flex:none;width:58px;height:58px;border-radius:16px;border:none;background:var(--card);color:var(--acc2);font-size:30px;font-weight:700;cursor:pointer;box-shadow:0 1px 3px #0b1f2e1a;font-family:inherit;line-height:1}
.st:active{transform:scale(.94);background:var(--acc);color:#fff}
.big input{flex:1;min-width:0;border:none;background:none;text-align:center;font-family:inherit;font-size:44px;font-weight:800;color:var(--ink);direction:ltr;font-variant-numeric:tabular-nums;outline:none;-moz-appearance:textfield}
.big input::-webkit-outer-spin-button,.big input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{display:none}
.conv{text-align:center;color:var(--mut);font-size:13px;margin-top:8px;min-height:20px}
.colors{color:var(--acc);font-weight:700;margin-top:8px}
/* table */
details summary{cursor:pointer;color:var(--acc2);font-size:14px;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
.grid{overflow-x:auto;direction:ltr}
.grid table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
.grid th{color:var(--acc2);font-size:14px;font-weight:800;padding:6px 3px}
.grid td{padding:6px 3px;text-align:center;border-top:1px solid var(--line);line-height:1.2}
.grid td.len{color:var(--acc2);font-weight:800}
.grid td.len small{display:block;color:var(--mut);font-weight:500;font-size:10px}
.grid td.hit,.grid tr.hr td.hit{background:var(--acc);color:#fff;border-radius:8px}
.grid td.hit .dm{color:#ffe6d3}
.grid th.hc{background:var(--accs);border-radius:8px}
.grid tr.hr td{background:#0a4f7a0d}
.dm{display:block;font-size:.8em;color:var(--mut)}
.ltr{direction:ltr}
.note{font-size:12px;color:var(--mut)}
.foot{text-align:center;margin:18px 14px 0}
table{border-collapse:collapse}
#lenWrap{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="bar"><h1>🎣 حاسبة <b>التروللينق</b></h1><button id="night" class="nb" aria-label="وضع الليل">🌙</button></div>
    <div id="out"></div>
  </div>

  <div class="sec">
    <div class="lbl"><span><span class="num">١</span>اختار الجدول</span></div>
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="sec" id="boardWrap">
    <div class="lbl" id="boardLbl">رقم البورد</div>
    <div class="seg" id="boards"></div>
    <div id="chNote"></div>
  </div>

  <div class="sec" id="depWrap">
    <div class="lbl"><span id="depLbl">العمق</span><span id="du"><button data-u="ft">قدم</button><button data-u="m">متر</button></span></div>
    <div class="big"><button class="st" data-s="-1" aria-label="نقص">−</button><input id="dep" type="number" inputmode="decimal" step="0.5" min="0" placeholder="0"><button class="st" data-s="1" aria-label="زيادة">+</button><span class="unit" id="duL">ft</span></div>
    <div class="conv" id="conv"></div>
    <div id="lenWrap"><input id="len" type="number"><div class="colors" id="colors"></div></div>
  </div>

  <div class="sec">
    <details><summary id="gridTitle">الجدول</summary>
    <div class="grid" id="full" style="margin-top:10px"></div></details>
  </div>

  <p class="note foot">النسخة 9 · كل لون = 10 م · الأرقام تقريبية · المصدر: @alrashed_trolling</p>
</div>
<script>
const CHARTS=[
 {id:"bait",name:"كنعد — طُعم حي",sub:"سرعة 1.5–4.5 كم",colName:"الوزن (بلد)",cols:[4,6,8,10,12,14,16],
  rows:[[10,5.5,6,7.5,8.5,11,13.5,16],[20,11,12,15,17,22,27,32],[30,16.5,18,22.5,25.5,33,40.5,48],[40,22,24,30,34,44,54,64],[50,27,30,37.5,42.5,55,67.5,80],[60,33,36,45,51,66,81,96],[70,38.5,42,52.5,59.5,77,94.5,112],[80,44,48,60,68,88,108,128],[90,49.5,54,67.5,76.5,99,121.5,144],[100,55,60,75,85,110,135,160],[110,60.5,66,82.5,93.5,121,148.5,176],[120,66,72,90,102,132,162,192],[130,71.5,78,97.5,110.5,143,175.5,208]]},
 {id:"spoon",name:"كنعد — بورد + سبون",sub:"Yo-Zuri · سرعة 11–12 كم",colName:"رقم البورد",cols:[6,7,8,9,10,11,12],
  rows:[[10,12,12,15,16,18,20,21],[15,15,17,20,23,25,27,28],[20,18,22,26,30,32,35,39],[25,20,24,30,35,40,41,45],[30,23,27,35,40,45,48,51],[35,24.5,28,37,43,49,52,55],[40,25,31,40,47,54,55,62],[45,26.5,33,42,49,56,59,69],[50,28,35,44,54,62,62,72],[55,29,37,46,56,64,67,77],[60,30,39,47,58,66,70,79],[65,31,40,49,60,70,72,83],[70,32,42,51,64,73,76,87]]},
 {id:"hammour",name:"هامور — بورد + لور",sub:"Yo-Zuri · سرعة 6–7 كم",colName:"رقم البورد",cols:[9,10,11,12,13],
  rows:[[10,15,19,18,20,21],[15,24,25,24,27,30.5],[20,29,32,31,36,39],[25,32,38,33,42,44],[30,37,41,41,48,51],[35,39,46,43,53,56],[40,40,48,48,55,62.5],[45,41.5,51,52,59,65],[50,43,54,53,63,72.5],[55,43.5,56,55,63.5,78],[60,44,58,58,64,87],[65,44.5,59,61,68,91],[70,45,60,64,72,97]]}
];
CHARTS.push({id:"bull",type:"sea",name:"هامور — دبل لور",sub:"سرعة 6–7 كم · عمق البحر",colName:"نوع اللور",
 cols:["2 x SHADOW","2 x STORM","SHADOW + 2M LURE","STORM + 2M LURE","Nomad + Shadow"],
 note:"<bdi>2M LURE</bdi> = أي لور نزوله 1.5–3 متر، مثل المزوزي 160 أو الماكل 190 واللورات المقاربة.",
 rows:[[3,6,8,8,8,null],[4,8,10,8,8,5],[5,10,12,10,10,8],[6,14,16,14,14,11],[7,17,17,19,19,13],[8,22,24,25,25,16],[9,25,27,32,32,18],[10,35,37,37,37,20],[12,null,null,null,null,30],[14,null,null,null,null,40],[16,null,null,null,null,65],[18,null,null,null,null,[80,120]],[20,null,null,null,null,150]]});
const FT=0.3048;
const AR=["","لون","لونين","ثلاث ألوان","أربع ألوان","خمس ألوان","ست ألوان","سبع ألوان","ثمان ألوان","تسع ألوان","عشر ألوان","احدى عشر لون","اثنى عشر لون","ثلاث عشر لون"];
let st={c:0,b:null,mode:"auto",pick:null,du:"ft",night:false};
try{const s=JSON.parse(localStorage.getItem("trollState3"));if(s)st=Object.assign(st,s)}catch(e){}
st.mode="auto";
const $=s=>document.querySelector(s);
const fmt=n=>(Math.round(n*10)/10).toString();
const D=ft=>`<span dir="ltr">${fmt(ft)} ft<span class="dm">${fmt(ft*FT)} m</span></span>`;
function colorsTxt(m){if(!(m>0))return"";const c=m/10,w=Math.floor(c),half=c-w;
  if(Math.abs(c-Math.round(c))<0.05&&AR[Math.round(c)])return "= "+AR[Math.round(c)];
  if(Math.abs(half-0.5)<0.05&&AR[w])return "= "+AR[w]+" ونص";
  return "≈ "+fmt(c)+" لون";}
function save(){try{localStorage.setItem("trollState3",JSON.stringify(st))}catch(e){}}
function depthAt(ch,j,L){const R=ch.rows,n=R.length;
  if(L<=R[0][0])return{d:R[0][j+1]*L/R[0][0],out:L<R[0][0]};
  for(let i=0;i<n-1;i++){const a=R[i],b=R[i+1];if(L<=b[0]){const t=(L-a[0])/(b[0]-a[0]);return{d:a[j+1]+t*(b[j+1]-a[j+1]),out:false}}}
  const a=R[n-2],b=R[n-1];return{d:b[j+1]+(L-b[0])*(b[j+1]-a[j+1])/(b[0]-a[0]),out:true};}
function lenFor(ch,j,Dt){const R=ch.rows,n=R.length;
  if(Dt<=R[0][j+1])return R[0][0]*Dt/R[0][j+1];
  for(let i=0;i<n-1;i++){const a=R[i],b=R[i+1];if(Dt<=b[j+1]&&b[j+1]>a[j+1]){const t=(Dt-a[j+1])/(b[j+1]-a[j+1]);return a[0]+t*(b[0]-a[0])}}
  return null;}
let hit={row:null,col:null};
const num=x=>isNaN(+x)?x:+x;
const mid=v=>Array.isArray(v)?(v[0]+v[1])/2:v;
const vtxt=v=>Array.isArray(v)?v[0]+"–"+v[1]:fmt(v);
function seaLine(ch,j,Dm){const R=ch.rows.filter(r=>r[j+1]!=null);if(!R.length)return null;
  const ex=ch.rows.find(r=>Math.abs(r[0]-Dm)<0.05);if(ex&&ex[j+1]==null)return null;
  const eq=R.find(r=>Math.abs(r[0]-Dm)<0.05);if(eq)return{v:eq[j+1],exact:true,lo:false};
  if(Dm<R[0][0]){return Dm>=R[0][0]-1.01?{v:R[0][j+1],exact:false,lo:true}:null}
  for(let i=0;i<R.length-1;i++){const a=R[i],b=R[i+1];if(Dm>a[0]&&Dm<b[0]){const t=(Dm-a[0])/(b[0]-a[0]);return{v:mid(a[j+1])+t*(mid(b[j+1])-mid(a[j+1])),exact:false}}}
  return null;}
function drawTop(){
  const IC={bait:"🐟",spoon:"🥄",hammour:"🐠",bull:"🪝"};$("#tabs").innerHTML=CHARTS.map((c,i)=>`<button data-i="${i}" class="${i==st.c?"on":""}"><span class="ic">${IC[c.id]||"🎣"}</span><b>${c.name}</b><small>${c.sub}</small></button>`).join("");
  $("#chNote").innerHTML=CHARTS[st.c].note||"";
  const ch=CHARTS[st.c];
  if(!ch.cols.includes(st.b))st.b=ch.cols[Math.floor(ch.cols.length/2)];
  $("#boardLbl").innerHTML='<span class="num">٢</span> اختار '+ch.colName;
  document.querySelectorAll("#du button").forEach(b=>b.classList.toggle("on",b.dataset.u==st.du));$("#duL").textContent=st.du;
  $("#boards").innerHTML=ch.cols.map(c=>`<button data-b="${c}" dir="ltr" class="${c==st.b?"on":""}">${c}</button>`).join("");
  document.querySelectorAll("#mode button").forEach(b=>b.classList.toggle("on",b.dataset.m==st.mode));
  $("#lenWrap").style.display=st.mode=="len"?"":"none";
  $("#depWrap").style.display=st.mode=="len"?"none":"";
  $("#boardWrap").style.display="";
  $("#gridTitle").textContent="📋 عرض الجدول الكامل — "+ch.name+" ("+ch.sub+")";
}
function calc(){
  const ch=CHARTS[st.c],L=parseFloat($("#len").value),dv=parseFloat($("#dep").value),Dt=st.du=="m"?dv/FT:dv,out=$("#out");
  $("#colors").textContent=colorsTxt(L);
  $("#conv").textContent=Dt>0?(st.du=="m"?"= "+fmt(Dt)+" قدم ft":"= "+fmt(Dt*FT)+" متر"):"";
  hit={row:null,col:null};
  const near=x=>ch.rows.reduce((a,r)=>Math.abs(r[0]-x)<Math.abs(a[0]-x)?r:a)[0];
  const thead=`<thead><tr><th>${ch.colName}</th>`;
  if(ch.type=="sea"){
    $("#depLbl").innerHTML='<span class="num">٣</span> اكتب عمق البحر';
    if(!(Dt>0)){out.innerHTML='<div class="empty"><div style="font-size:30px;font-weight:800;color:#ffb36b">— م</div>طول الخيط بيطلع هني — اختار واكتب العمق تحت 👇</div>';drawFull();return}
    const Dm=Dt*FT, j=ch.cols.indexOf(st.b), r=seaLine(ch,j,Dm);
    const alts=ch.cols.map((c,k)=>({c,r:seaLine(ch,k,Dm)})).filter(x=>x.r);
    if(r){const near2=ch.rows.reduce((a,x)=>Math.abs(x[0]-Dm)<Math.abs(a[0]-Dm)?x:a)[0];hit={row:near2,col:st.b}}
    const L=r?mid(r.v):0;
    out.innerHTML=`<div class="hero"><div class="k"><bdi>${st.b}</bdi> · عمق البحر ${fmt(Dm)} م (${fmt(Dt)} ft)</div><div class="k" style="margin-top:6px">طول امتداد الخيط</div>${r?`<div class="v" dir="rtl">${r.exact?vtxt(r.v):"≈ "+fmt(r.v)} م</div><div class="v2" dir="rtl">${Array.isArray(r.v)?(r.v[0]/10)+"–"+(r.v[1]/10)+" ألوان":colorsTxt(L).replace(/^= /,"")}</div>${r.exact?"":`<div class="warn">${r.lo?"أقل من أصغر عمق بالجدول — استخدم أقصر طول":"بين صفين بالجدول — الرقم تقريبي"}</div>`}`:`<div class="v" style="font-size:22px"><bdi>${st.b}</bdi> ما يناسب هالعمق (x)</div>${alts.length?`<div class="warn">يناسبه: ${alts.map(a=>"<bdi>"+a.c+"</bdi> ← "+(a.r.exact?vtxt(a.r.v):"≈ "+fmt(a.r.v))+" م").join(" · ")}</div>`:`<div class="warn">هالعمق خارج الجدول (3–20 م)</div>`}`}</div><p class="note">${ch.note}</p>`;
    drawFull();return;
  }
  $("#depLbl").innerHTML='<span class="num">٣</span> اكتب العمق اللي تبيه';
  if(st.mode=="auto"){
    if(!(Dt>0)){out.innerHTML='<div class="empty"><div style="font-size:30px;font-weight:800;color:#ffb36b">— م</div>طول الخيط بيطلع هني — اختار واكتب العمق تحت 👇</div>';drawFull();return}
    const res=ch.cols.map((c,j)=>({c,L:lenFor(ch,j,Dt)}));
    const ok=res.filter(r=>r.L!=null);
    if(!ok.length){out.innerHTML=`<div class="hero"><div class="v" style="font-size:26px">ما في رقم يوصل ${fmt(Dt)} ft</div><div class="warn">أعمق شي بهالجدول ${D(ch.rows[ch.rows.length-1][ch.cols.length])}</div></div>`;drawFull();return}
    const best=ok.reduce((a,b)=>a.L<b.L?a:b);
    const pick=res.find(r=>r.c==st.b);
    if(pick.L!=null)hit={row:near(pick.L),col:pick.c};
    out.innerHTML=`<div class="hero"><div class="k">${ch.colName} ${pick.c} · عمق ${fmt(Dt)} ft (${fmt(Dt*FT)} م)</div><div class="k" style="margin-top:6px">طول امتداد الخيط</div>${pick.L!=null?`<div class="v" dir="rtl">${fmt(pick.L)} م</div><div class="v2" dir="rtl">${colorsTxt(pick.L).replace(/^= /,"")}</div>`:`<div class="v" style="font-size:24px">${ch.colName} ${pick.c} ما يوصل لهالعمق</div><div class="warn">جرّب ${ch.colName} ${best.c} — يحتاج ${fmt(best.L)} م</div>`}</div>`;
  }else if(st.mode=="len"){
    if(!(L>0)){out.innerHTML='<div class="empty"><div style="font-size:30px;font-weight:800;color:#ffb36b">— م</div>طول الخيط بيطلع هني — اختار واكتب العمق تحت 👇</div>';drawFull();return}
    const bi=ch.cols.indexOf(st.b),r=depthAt(ch,bi,L);
    hit={row:near(L),col:st.b};
    out.innerHTML=`<div class="hero"><div class="k">${ch.colName} ${st.b} · ${fmt(L)} م خيط</div><div class="v">${D(r.d)}</div>${r.out?`<div class="warn">⚠️ خارج الجدول — الرقم تقديري</div>`:""}</div>
    <table>${thead}<th>العمق</th></tr></thead><tbody>${ch.cols.map((c,j)=>`<tr data-b="${c}" class="${c==st.b?"sel":""}"><td>${c}</td><td class="ltr">${D(depthAt(ch,j,L).d)}</td></tr>`).join("")}</tbody></table>`;
  }else{
    if(!(Dt>0)){out.innerHTML='<div class="empty"><div style="font-size:30px;font-weight:800;color:#ffb36b">— م</div>طول الخيط بيطلع هني — اختار واكتب العمق تحت 👇</div>';drawFull();return}
    const res=ch.cols.map((c,j)=>({c,L:lenFor(ch,j,Dt)}));
    const sel=res.find(r=>r.c==st.b);
    if(sel.L!=null)hit={row:near(sel.L),col:st.b};
    out.innerHTML=`<div class="hero"><div class="k">${ch.colName} ${st.b} · عمق ${fmt(Dt)} ft (${fmt(Dt*FT)} م)</div>${sel.L!=null?`<div class="v">${fmt(sel.L)} م</div><div class="v2">${colorsTxt(sel.L)}</div>`:`<div class="v" style="font-size:26px">ما يوصل لهالعمق</div><div class="warn">جرّب رقم أكبر</div>`}</div>
    <table>${thead}<th>طول الخيط</th><th>الألوان</th></tr></thead><tbody>${res.map(r=>`<tr data-b="${r.c}" class="${r.c==st.b?"sel":""}"><td>${r.c}</td><td class="ltr">${r.L!=null?fmt(r.L)+" م":"—"}</td><td>${r.L!=null?colorsTxt(r.L).replace(/^[=≈] /,""):"ما يوصل"}</td></tr>`).join("")}</tbody></table>`;
  }
  drawFull();
}
function speedNote(){const ch=CHARTS[st.c],h=document.querySelector("#out .hero");if(h&&!h.querySelector(".spd")){const s=(ch.sub.match(/سرعة [^·]+/)||[""])[0].trim();if(s)h.insertAdjacentHTML("beforeend",`<div class="spd">⚓ ${s}</div>`)}}
function drawFull(){
  const ch=CHARTS[st.c];speedNote();
  if(ch.type=="sea"){$("#full").innerHTML=`<table dir="ltr"><thead><tr><th>عمق البحر</th>${ch.cols.map(c=>`<th class="${c==hit.col?"hc":""}" style="font-size:12px">${c}</th>`).join("")}</tr></thead><tbody>${ch.rows.map(r=>`<tr class="${r[0]==hit.row?"hr":""}"><td class="len">${r[0]}m</td>${r.slice(1).map((x,j)=>`<td class="${r[0]==hit.row&&ch.cols[j]==hit.col?"hit":""}">${x==null?'<span style="color:var(--mut)">x</span>':vtxt(x)+" m"}</td>`).join("")}</tr>`).join("")}</tbody></table><p class="note">الأرقام = طول الخيط بالمتر. x = ما يناسب. ${ch.note}</p>`;return}
  $("#full").innerHTML=`<table dir="ltr"><thead><tr><th></th>${ch.cols.map(c=>`<th class="${c==hit.col?"hc":""}">${c}</th>`).join("")}</tr></thead><tbody>${ch.rows.map(r=>`<tr class="${r[0]==hit.row?"hr":""}"><td class="len">${r[0]}m<small>${colorsTxt(r[0]).replace(/^[=≈] /,"")}</small></td>${r.slice(1).map((x,j)=>`<td class="${r[0]==hit.row&&ch.cols[j]==hit.col?"hit":""}">${D(x)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.c=+b.dataset.i;st.pick=null;st.b=null;drawTop();calc();save()};
$("#boards").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.b=num(b.dataset.b);drawTop();calc();save()};
$("#out").onclick=e=>{const q=e.target.closest("tr[data-p]");if(q){st.b=+q.dataset.p;drawTop();calc();save();return}const t=e.target.closest("tr[data-b]");if(!t)return;st.b=+t.dataset.b;drawTop();calc();save()};
if($("#mode"))$("#mode").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.mode=b.dataset.m;drawTop();calc();save()};
$("#len").addEventListener("input",calc);
$("#du").onclick=e=>{const b=e.target.closest("button");if(!b||b.dataset.u==st.du)return;const v=parseFloat($("#dep").value);if(v>0)$("#dep").value=fmt(b.dataset.u=="m"?v*FT:v/FT);st.du=b.dataset.u;drawTop();calc();save()};
$("#dep").addEventListener("input",()=>{st.pick=null;calc()});
document.querySelectorAll(".st").forEach(b=>b.onclick=()=>{const step=st.du=="m"?0.5:1;let v=parseFloat($("#dep").value)||0;v=Math.max(0,Math.round((v+step*+b.dataset.s)/step)*step);$("#dep").value=v?fmt(v):"";calc()});
function applyNight(){document.documentElement.classList.toggle("night",!!st.night);$("#night").textContent=st.night?"☀️":"🌙";const m=document.querySelector('meta[name=theme-color]');if(m)m.content=st.night?"#0b1a24":"#0a4f7a"}
$("#night").onclick=()=>{st.night=!st.night;applyNight();save()};applyNight();
drawTop();calc();
</script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
  let done=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!done){done=true;location.reload()}});
}
</script>
</body>
